<title id="title">Prism — from IMU variation to task-aware inference</title>
<desc id="desc">Original conceptual illustration. NID assesses non-i.i.d. data, EM learns task-aware domains, and a device routes an embedding to its nearest domain model. Shapes are schematic, not measured data.</desc>
